services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      WEB_ORIGIN: "${WEB_ORIGIN:-}"
      COOLIFY_DB_WAIT_TIMEOUT: "${COOLIFY_DB_WAIT_TIMEOUT:-60000}"
      S3_ENDPOINT: "${S3_ENDPOINT:?S3_ENDPOINT is required}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      S3_BUCKET: "${S3_BUCKET:-fatboy-file}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
    expose:
      - "3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-/api}"
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
